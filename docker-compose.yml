version: '3.9'

services:
  tokens:
    build: .
    container_name: tokens_service
    volumes:
      - ./tokens:/services/tokens
      - ./config.py:/services/config.py
    command: >
      bash -c "
      echo '25 22 * * * python /services/tokens/main.py >> /var/log/cron.log 2>&1' > /etc/cron.d/tokens &&
      chmod 0644 /etc/cron.d/tokens &&
      echo '0 */6 * * * python /services/tokens/main.py >> /var/log/cron.log 2>&1' > /etc/cron.d/tokens &&
      chmod 0644 /etc/cron.d/tokens &&
      cron -f
      "

  subscribe:
    build: .
    container_name: subscribes_service
    volumes:
      - ./subscribes:/services/subscribes
      - ./config.py:/services/config.py
    command: >
      bash -c "
      echo '27 22 * * * python /services/subscribes/main.py >> /var/log/cron.log 2>&1' > /etc/cron.d/subscribes &&
      chmod 0644 /etc/cron.d/subscribes &&
      cron -f
      "

  franchisee:
    build: .
    container_name: franchisee_service
    volumes:
      - ./franchisee:/services/franchisee
      - ./config.py:/services/config.py
    command: >
      bash -c "
      echo '29 22 * * * python /services/franchisee/main.py >> /var/log/cron.log 2>&1' > /etc/cron.d/franchisee &&
      chmod 0644 /etc/cron.d/franchisee &&
      cron -f
      "