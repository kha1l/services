version: '3.9'

x-common: &cron-service
  build: .
  restart: unless-stopped

services:
  tokens:
    <<: *cron-service
    container_name: tokens_service
    volumes:
      - ./logs:/services/logs
      - ./config.py:/services/config.py:ro
    command: |
      sh -c '
      set -e
      cat <<EOF > /etc/cron.d/tokens
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH=/services
      0 */6 * * * root cd /services && python tokens/main.py >> /services/logs/cron_tokens.log 2>&1
      EOF
      chmod 0644 /etc/cron.d/tokens
      cron -f
      '

  subscribes:
    <<: *cron-service
    container_name: subscribes_service
    volumes:
      - ./logs:/services/logs
      - ./config.py:/services/config.py:ro
    command: |
      sh -c '
      set -e
      cat <<EOF > /etc/cron.d/subscribes
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH=/services
      0 4 * * * root cd /services && python subscribes/main.py >> /services/logs/cron_subscribes.log 2>&1
      EOF
      chmod 0644 /etc/cron.d/subscribes
      cron -f
      '

  franchisee:
    <<: *cron-service
    container_name: franchisee_service
    volumes:
      - ./logs:/services/logs
      - ./config.py:/services/config.py:ro
    command: |
      sh -c '
      set -e
      cat <<EOF > /etc/cron.d/franchisee
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH=/services
      0 5 * * * root cd /services && python franchisee/main.py >> /services/logs/cron_franchisee.log 2>&1
      EOF
      chmod 0644 /etc/cron.d/franchisee
      cron -f
      '
